# Faz uma consulta simples ao banco todo dia para o Supabase (plano gratuito)
# não pausar o projeto por inatividade. Usa só a chave pública (publishable).
name: Manter Supabase ativo
on:
  schedule:
    - cron: '17 11 * * *'   # todo dia às 08:17 (horário de Brasília)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        run: |
          curl -sf -X POST "https://hpvbnhihawrqvjbnqomb.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_62Bd_Z9tw5O1eTJ2DaMHSQ_RM5tZ_sj" \
            -H "Content-Type: application/json" -d '{}'
